name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.formula }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        formula: [undatum]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Tap this checkout
        run: brew tap datenoio/tap "$GITHUB_WORKSPACE"
      - name: Install without trusting the tap (probe)
        id: untrusted
        continue-on-error: true
        run: brew install --verbose datenoio/tap/${{ matrix.formula }} </dev/null
      - name: Trust the tap
        run: brew trust --tap datenoio/tap
      - name: Audit
        continue-on-error: true
        run: brew audit --formula --tap=datenoio/tap
      - name: Install
        run: brew install --verbose datenoio/tap/${{ matrix.formula }}
      - name: Test
        run: brew test --verbose datenoio/tap/${{ matrix.formula }}
